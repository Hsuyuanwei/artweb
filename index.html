<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青綠未央 — 115美術教學參觀日</title>
  <link rel="icon" type="image/png" href="https://jsh.dafuntea.com/%E5%8E%BB%E8%83%8C%E7%9A%84%E4%B8%8B%E8%BC%89.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* 預設動態變數 */
      --bg-current: #f4f9f8;
      --text-current: #0d3b2e;
      --title-current: #007a68;
      --pill-bg-current: rgba(0, 122, 104, 0.12);
      --pill-text-current: #006052;
      --btn-bg-current: #008f7a;
      --btn-text-current: #ffffff;

      --font-display: 'Antonio', 'Noto Sans TC', sans-serif;
      --font-body: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-current);
      color: var(--text-current);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    /* --- 開場 Splash 校徽旋轉放大遮罩動畫 --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #004b3a;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.5s ease 0.4s, visibility 0.5s ease 0.4s;
    }

    #splash-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      max-width: 800px;
      line-height: 1.2;
      padding: 0 20px;
      margin-bottom: 40px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .highlight-teal {
      color: #003327;
      background: #80ed99;
      padding: 2px 8px;
    }

    /* 校徽 Logo 元素 */
    #splash-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.5s ease;
      will-change: transform;
    }

    #splash-screen.start-zoom #splash-text {
      opacity: 0;
      transform: scale(0.9);
    }

    #splash-screen.start-zoom #splash-logo {
      transform: rotate(180deg) scale(45);
    }

    #splash-screen.fade-off {
      opacity: 0;
      visibility: hidden;
    }

    /* --- 畫面兩側固定控制按鈕 --- */
    .brand-circle {
      width: 50px;
      height: 50px;
      border-radius: 9999px;
      background-color: var(--btn-bg-current);
      color: var(--btn-text-current);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, background-color 0.6s ease;
    }

    .brand-circle:hover {
      transform: scale(1.1);
    }

    .brand-circle img { width: 26px; height: 26px; }

    /* 右側集章活動帶文字膠囊按鈕 (Pill Action Button) */
    .stamp-pill-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      height: 50px;
      padding: 0 20px 0 16px;
      border-radius: 9999px;
      background-color: var(--btn-bg-current);
      color: var(--btn-text-current);
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, background-color 0.6s ease, box-shadow 0.2s ease;
    }

    .stamp-pill-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .stamp-pill-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Header */
    header {
      padding: 36px 90px 10px 90px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .school-tag {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--title-current);
      transition: color 0.6s ease;
    }

    .event-title {
      font-size: 22px;
      font-weight: 900;
    }

    /* Main Showcase Layout */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 90px;
      align-items: center;
    }

    .info-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .info-section.fade-out {
      opacity: 0;
      transform: translateY(12px);
    }

    .pill-tag {
      background-color: var(--pill-bg-current);
      color: var(--pill-text-current);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 20px;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .display-title {
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.85;
      color: var(--title-current);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      transition: color 0.6s ease;
    }

    .description-text {
      font-size: 18px;
      line-height: 1.6;
      max-width: 50ch;
      margin-bottom: 24px;
      opacity: 0.95;
    }

    .teacher-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .teacher-item {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .teacher-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--title-current);
      transition: background-color 0.6s ease;
    }

    .guide-quote {
      font-size: 15px;
      font-weight: 600;
      font-style: italic;
      border-left: 4px solid var(--title-current);
      padding-left: 14px;
      opacity: 0.95;
      transition: border-color 0.6s ease;
    }

    /* Vertical Editorial Card Container */
    .card-stage {
      position: relative;
      width: 100%;
      height: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .vertical-card {
      position: absolute;
      width: 340px;
      height: 480px;
      background-color: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      border: 4px solid #fff;
    }

    .vertical-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-overlay-title {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 4px rgba(0,0,0,0.5);
      line-height: 1;
    }

    .vertical-card.active {
      transform: translateX(0) scale(1.05);
      z-index: 3;
      opacity: 1;
      border-color: var(--title-current);
    }

    .vertical-card.prev {
      transform: translateX(-140px) scale(0.88);
      z-index: 2;
      opacity: 0.6;
    }

    .vertical-card.next {
      transform: translateX(140px) scale(0.88);
      z-index: 2;
      opacity: 0.6;
    }

    .vertical-card.hidden {
      transform: translateX(0) scale(0.7);
      z-index: 1;
      opacity: 0;
    }

    /* Carousel Nav Bar */
    .carousel-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding-bottom: 40px;
    }

    .arrow-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .arrow-btn:hover {
      background-color: var(--btn-bg-current);
      border-color: var(--btn-bg-current);
      color: var(--btn-text-current);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 12px; }

    @media (max-width: 900px) {
      header, main { padding-left: 24px; padding-right: 24px; }
      main { grid-template-columns: 1fr; }
      .display-title { font-size: 64px; }
      .vertical-card.prev { transform: translateX(-60px) scale(0.85); }
      .vertical-card.next { transform: translateX(60px) scale(0.85); }
      .stamp-pill-btn span { display: none; } /* 行動裝置上自動折疊文字，保持畫面乾淨 */
      .stamp-pill-btn { padding: 0 14px; }
    }
  </style>
</head>
<body>

  <!-- 1. 開場 Splash 動畫 (校徽旋轉放大遮罩) -->
  <div id="splash-screen">
    <div id="splash-text">
      放慢步調，探索藝術靈魂。<br>
      <span class="highlight-teal">青綠未央</span> 115美術教學參觀日
    </div>
    <img id="splash-logo" src="img/logo遮罩.png" alt="校徽">
  </div>

  <!-- 2. 畫面上方固定控制按鈕與膠囊連結 -->
  <button class="brand-circle" title="弘明實驗高級中學" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <img src="https://jsh.dafuntea.com/%E5%8E%BB%E8%83%8C%E7%9A%84%E4%B8%8B%E8%BC%89.png" alt="Logo">
  </button>

  <a class="stamp-pill-btn" href="https://artcoc.dafuntea.com" title="前往集章活動頁面">
    <svg viewBox="0 0 24 24">
      <path d="M12 2A10 10 0 1 0 22 12 10 10 0 0 0 12 2Zm1 15h-2v-6h2Zm0-8h-2V7h2Z"/>
    </svg>
    <span>集章活動頁面</span>
  </a>

  <!-- Header -->
  <header>
    <div>
      <div class="school-tag">弘明實驗高級中學</div>
      <div class="event-title">美術教學參觀日</div>
    </div>
  </header>

  <!-- Main Showcase -->
  <main>
    <div class="info-section" id="info-section">
      <div class="pill-tag" id="pill-tag">載入中</div>
      <h1 class="display-title" id="main-title">青綠未央</h1>
      <p class="description-text" id="main-description"></p>
      
      <div class="teacher-list" id="main-steps"></div>
      
      <p class="guide-quote" id="main-guide"></p>
    </div>

    <!-- 直式 3D 卡片滑台 -->
    <div class="card-stage" id="card-stage"></div>
  </main>

  <div class="carousel-nav">
    <button class="arrow-btn" id="btn-prev">❮</button>
    <button class="arrow-btn" id="btn-next">❯</button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="image-modal">
    <img class="modal-img" id="modal-img" src="" alt="Zoomed">
  </div>

  <script>
    const themeColors = [
      {
        bg: '#f4f9f8',
        text: '#0d3b2e',
        title: '#006052',
        pillBg: 'rgba(0, 122, 104, 0.12)',
        pillText: '#006052',
        btnBg: '#008f7a',
        btnText: '#ffffff'
      },
      {
        bg: '#082820',
        text: '#e0f2ed',
        title: '#52b788',
        pillBg: 'rgba(82, 183, 136, 0.2)',
        pillText: '#74c69d',
        btnBg: '#2a9d8f',
        btnText: '#ffffff'
      },
      {
        bg: '#004d40',
        text: '#e0f7fa',
        title: '#80cbc4',
        pillBg: 'rgba(128, 203, 196, 0.2)',
        pillText: '#b2dfdb',
        btnBg: '#00796b',
        btnText: '#ffffff'
      },
      {
        bg: '#1b3b36',
        text: '#d8f3dc',
        title: '#74c69d',
        pillBg: 'rgba(116, 198, 157, 0.2)',
        pillText: '#95d5b2',
        btnBg: '#40916c',
        btnText: '#ffffff'
      },
      {
        bg: '#eef9f6',
        text: '#064e3b',
        title: '#047857',
        pillBg: 'rgba(4, 120, 87, 0.12)',
        pillText: '#065f46',
        btnBg: '#059669',
        btnText: '#ffffff'
      }
    ];

    let cardsData = [];
    let currentIndex = 0;

    const infoSection = document.getElementById('info-section');
    const pillTag = document.getElementById('pill-tag');
    const mainTitle = document.getElementById('main-title');
    const mainDescription = document.getElementById('main-description');
    const mainSteps = document.getElementById('main-steps');
    const mainGuide = document.getElementById('main-guide');
    const cardStage = document.getElementById('card-stage');
    const splashScreen = document.getElementById('splash-screen');

    async function initApp() {
      // 1. 開場旋轉與放大遮罩動畫流程
      setTimeout(() => {
        splashScreen.classList.add('start-zoom');
      }, 1000);

      setTimeout(() => {
        splashScreen.classList.add('fade-off');
      }, 2100);

      // 2. 讀取 JSON 資料
      try {
        const res = await fetch('data.json');
        cardsData = await res.json();
        if (cardsData.length > 0) {
          renderVerticalCards();
          updateCardDisplay(0, false);
        }
      } catch (err) {
        mainTitle.textContent = "載入失敗";
      }
    }

    function renderVerticalCards() {
      cardStage.innerHTML = '';
      cardsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'vertical-card hidden';
        card.dataset.index = index;
        card.onclick = () => updateCardDisplay(index);

        card.innerHTML = `
          <div class="card-overlay-title">${item.cardTitle || item.mainTitle}</div>
          <img src="${item.previewImage || item.cardImage}" alt="${item.mainTitle}">
        `;
        cardStage.appendChild(card);
      });
    }

    function updateCardDisplay(index, animate = true) {
      currentIndex = index;
      const data = cardsData[currentIndex];

      const theme = themeColors[currentIndex % themeColors.length];
      document.documentElement.style.setProperty('--bg-current', theme.bg);
      document.documentElement.style.setProperty('--text-current', theme.text);
      document.documentElement.style.setProperty('--title-current', theme.title);
      document.documentElement.style.setProperty('--pill-bg-current', theme.pillBg);
      document.documentElement.style.setProperty('--pill-text-current', theme.pillText);
      document.documentElement.style.setProperty('--btn-bg-current', theme.btnBg);
      document.documentElement.style.setProperty('--btn-text-current', theme.btnText);

      const allCards = cardStage.querySelectorAll('.vertical-card');
      const total = cardsData.length;

      allCards.forEach((card, idx) => {
        card.className = 'vertical-card';
        if (idx === currentIndex) {
          card.classList.add('active');
        } else if (idx === (currentIndex - 1 + total) % total) {
          card.classList.add('prev');
        } else if (idx === (currentIndex + 1) % total) {
          card.classList.add('next');
        } else {
          card.classList.add('hidden');
        }
      });

      const updateText = () => {
        pillTag.textContent = data.cardSubtitle || '展演內容';
        mainTitle.textContent = data.mainTitle;
        mainDescription.textContent = data.mainDescription;
        mainGuide.textContent = data.settingsGuide || '';

        mainSteps.innerHTML = '';
        if (data.steps) {
          data.steps.forEach(step => {
            const item = document.createElement('div');
            item.className = 'teacher-item';
            item.innerHTML = `<span class="teacher-dot"></span><span>${step}</span>`;
            mainSteps.appendChild(item);
          });
        }
      };

      if (animate) {
        infoSection.classList.add('fade-out');
        setTimeout(() => {
          updateText();
          infoSection.classList.remove('fade-out');
        }, 250);
      } else {
        updateText();
      }
    }

    document.getElementById('btn-prev').onclick = () => {
      let idx = currentIndex - 1;
      if (idx < 0) idx = cardsData.length - 1;
      updateCardDisplay(idx);
    };

    document.getElementById('btn-next').onclick = () => {
      let idx = (currentIndex + 1) % cardsData.length;
      updateCardDisplay(idx);
    };

    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');

    cardStage.addEventListener('click', (e) => {
      const activeCard = e.target.closest('.vertical-card.active');
      if (activeCard) {
        const img = activeCard.querySelector('img');
        modalImg.src = img.src;
        modal.classList.add('active');
      }
    });

    modal.onclick = () => modal.classList.remove('active');

    initApp();
  </script>
</body>
</html>
